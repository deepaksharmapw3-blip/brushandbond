name: Uptime check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check site and health endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "Repository variable SITE_URL is not set (Settings > Secrets and variables > Actions > Variables); skipping."
            exit 0
          fi
          SITE_URL="${SITE_URL%/}"
          fail=0
          for path in "/" "/api/health"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 2 --retry-delay 5 --max-time 20 "$SITE_URL$path" || echo 000)
            echo "$SITE_URL$path -> $code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
